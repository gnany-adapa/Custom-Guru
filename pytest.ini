[pytest]
# Silence third-party deprecation noise (chromadb on Python 3.14) to keep output pristine.
filterwarnings =
    ignore::DeprecationWarning:chromadb.*

# Marker registry — prevents "PytestUnknownMarkWarning" and documents intent.
markers =
    live: requires the Hyperspace proxy + .env key + local data store (skipped in CI)
